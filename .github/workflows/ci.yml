name: QA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa-test:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        # requirements.txt를 통해 설치된 Playwright Python 패키지의 명령어를 사용한다.
        # GitHub Actions의 새 Windows 실행 환경에는 Playwright용 Chromium이 없으므로
        # Web E2E 테스트를 실행하기 전에 호환되는 Chromium 브라우저를 내려받는다.
        run: python -m playwright install chromium

      - name: Create report and log folders
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Save environment information
        run: |
          python --version | Out-File -FilePath logs/environment_info.txt -Encoding utf8
          python -m pip freeze | Out-File -FilePath logs/environment_info.txt -Append -Encoding utf8

      - name: Run Smoke Tests
        run: |
          python -m pytest tests/smoke --junitxml=reports/smoke_result.xml --html=reports/smoke_result.html --self-contained-html *> logs/smoke_test_log.txt

          if ($LASTEXITCODE -ne 0) {
            "NO-GO" | Out-File -FilePath reports/quality_gate.txt -Encoding utf8
            exit $LASTEXITCODE
          }

      - name: Run Regression Tests
        run: |
          python -m pytest tests/regression --junitxml=reports/regression_result.xml --html=reports/regression_result.html --self-contained-html *> logs/regression_test_log.txt

          if ($LASTEXITCODE -ne 0) {
            "NO-GO" | Out-File -FilePath reports/quality_gate.txt -Encoding utf8
            exit $LASTEXITCODE
          }

      - name: Run Coverage Check
        # GitHub Actions 화면에 표시될 단계 이름이다.
        # 이 단계에서는 전체 테스트를 다시 실행하면서 app/device.py의 코드 커버리지를 측정한다.
        run: |
          # pytest-cov를 사용하여 tests 폴더 전체 테스트를 실행한다.
          # --cov=app.device는 app/device.py 파일 기준으로 커버리지를 측정한다는 뜻이다.
          # --cov-report=term-missing은 로그에 커버리지 표와 누락 라인을 출력한다.
          # --cov-report=xml:reports/coverage.xml은 XML 형식의 coverage 결과 파일을 생성한다.
          # --cov-report=html:reports/coverage_html은 사람이 볼 수 있는 HTML coverage report를 생성한다.
          # --cov-fail-under=90은 커버리지가 90% 미만이면 이 단계를 실패 처리한다.
          # *> logs/coverage_test_log.txt는 실행 로그를 coverage_test_log.txt 파일에 저장한다.
          python -m pytest tests -v --ignore=tests/web_ui --cov=app.device --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage_html --cov-fail-under=90
          
          # $LASTEXITCODE는 바로 위에서 실행한 pytest 명령어의 종료 결과값이다.
          # 0이면 성공, 0이 아니면 실패를 의미한다.
          # Coverage가 90% 미만이거나 테스트가 실패하면 pytest는 0이 아닌 값을 반환한다.
          if ($LASTEXITCODE -ne 0) {
            # Coverage Check 실패 시 Quality Gate 결과를 NO-GO로 저장한다.
            "NO-GO" | Out-File -FilePath reports/quality_gate.txt -Encoding utf8

            # GitHub Actions job을 실패 상태로 종료한다.
            exit $LASTEXITCODE
          }
      - name: Run Playwright Web E2E Tests
        # FastAPI Web Demo의 /login 화면을 실제 Chromium 브라우저로 검증한다.
        # 기존 Mock Device / API 테스트는 Coverage Check 단계에서 검증하고,
        # Web UI 테스트는 여기서 별도 E2E 단계로 실행한다.
        #
        # 이 단계 안에서 아래 작업을 한 번에 처리한다.
        # 1. FastAPI Web Demo 서버 실행
        # 2. /login 페이지 준비 상태 확인
        # 3. Playwright Web E2E 테스트 실행
        # 4. 테스트 종료 후 FastAPI 서버 종료
        #
        # 서버 실행과 /login 확인을 별도 GitHub Actions step으로 분리하면
        # 백그라운드 프로세스 유지나 접속 타이밍 문제가 생길 수 있다.
        # 그래서 서버 실행, 준비 확인, E2E 실행을 같은 step 안에서 처리한다.
        run: |
          # FastAPI Web Demo 서버를 백그라운드 프로세스로 실행한다.
          # Start-Process는 PowerShell에서 별도 프로세스를 실행할 때 사용하는 명령어다.
          # 여기서는 python -m uvicorn app.web_demo:app 명령을 별도 프로세스로 실행한다.
          $serverProcess = Start-Process `
            -FilePath python `
            -ArgumentList "-m", "uvicorn", "app.web_demo:app", "--host", "127.0.0.1", "--port", "8000" `
            -PassThru `
            -RedirectStandardOutput "logs/web_demo_server.log" `
            -RedirectStandardError "logs/web_demo_server_error.log"

          # 서버 프로세스가 시작되면 PID를 GitHub Actions 로그에 출력한다.
          # 나중에 서버 종료 또는 실패 분석 시 어떤 프로세스가 실행됐는지 확인할 수 있다.
          Write-Host "FastAPI Web Demo process started. PID=$($serverProcess.Id)"

          # Playwright 테스트가 접속할 로그인 페이지 URL이다.
          # 127.0.0.1은 GitHub Actions 실행 환경 내부의 자기 자신을 의미한다.
          $loginUrl = "http://127.0.0.1:8000/login"

          # 서버가 바로 준비되지 않을 수 있으므로 최대 30번까지 재시도한다.
          # 1초 간격으로 30번 확인하므로 최대 약 30초 동안 기다린다.
          $maxRetryCount = 30
          $retryIntervalSeconds = 1

          # 처음에는 /login 페이지가 아직 준비되지 않았다고 가정한다.
          # HTTP 200 응답을 받으면 이 값을 $true로 변경한다.
          $isReady = $false

          # /login 페이지가 정상 응답하는지 반복 확인한다.
          for ($retryIndex = 1; $retryIndex -le $maxRetryCount; $retryIndex++) {
            try {
              # Invoke-WebRequest는 PowerShell에서 HTTP 요청을 보내는 명령어다.
              # 여기서는 브라우저를 여는 것이 아니라 /login URL이 응답 가능한지만 확인한다.
              $response = Invoke-WebRequest -Uri $loginUrl -UseBasicParsing -TimeoutSec 2

              # HTTP 200은 서버가 요청을 정상 처리했다는 의미다.
              # /login이 200을 반환하면 Playwright 테스트를 실행할 준비가 된 상태다.
              if ($response.StatusCode -eq 200) {
                Write-Host "Login page is ready. URL=$loginUrl"
                $isReady = $true
                break
              }

              # 200이 아닌 응답이 오면 상태 코드를 로그로 남기고 다시 시도한다.
              Write-Host "Login page returned status code $($response.StatusCode). retry $retryIndex / $maxRetryCount"
              Start-Sleep -Seconds $retryIntervalSeconds
            }
            catch {
              # 서버가 아직 준비되지 않았거나 접속에 실패하면 catch로 들어온다.
              # 실패 원인을 확인할 수 있도록 마지막 오류 메시지를 함께 출력한다.
              Write-Host "Waiting for login page... retry $retryIndex / $maxRetryCount"
              Write-Host "Last error: $($_.Exception.Message)"
              Start-Sleep -Seconds $retryIntervalSeconds
            }
          }

          # 정해진 횟수 안에 /login 페이지가 준비되지 않으면 CI를 실패 처리한다.
          # 이때 FastAPI 서버 로그를 출력해서 원인을 분석할 수 있게 한다.
          if (-not $isReady) {
            Write-Host "Login page was not ready in time."
            Get-Content logs/web_demo_server.log -ErrorAction SilentlyContinue
            Get-Content logs/web_demo_server_error.log -ErrorAction SilentlyContinue

            # 실패하더라도 백그라운드 서버 프로세스는 정리한다.
            Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # /login 준비가 완료되면 Playwright Web E2E 테스트를 실행한다.
          # tests/web_ui 폴더만 대상으로 실행한다.
          # --browser chromium: Chromium 브라우저 사용
          # --base-url: page.goto("/login") 같은 상대 경로의 기준 주소
          # --output: screenshot, trace 같은 Playwright 결과 저장 폴더
          # --tracing=retain-on-failure: 실패한 테스트의 trace만 보관
          # --screenshot=only-on-failure: 실패한 테스트의 screenshot만 보관
          # --junitxml: CI 분석용 XML 결과 생성
          # --html: 사람이 보기 좋은 HTML 리포트 생성
          # *> logs/web_e2e_test_log.txt: 실행 로그를 파일로 저장
          python -m pytest tests/web_ui -v `
            --browser chromium `
            --base-url=http://127.0.0.1:8000 `
            --output=test-results `
            --tracing=retain-on-failure `
            --screenshot=only-on-failure `
            --junitxml=reports/web_e2e_result.xml `
            --html=reports/web_e2e_result.html `
            --self-contained-html `
            *> logs/web_e2e_test_log.txt

          # pytest 실행 결과 코드를 변수에 저장한다.
          # 바로 서버를 종료해야 하므로, 테스트 성공/실패 결과를 먼저 보관해둔다.
          $webE2eExitCode = $LASTEXITCODE

          # Playwright 테스트가 끝났으므로 FastAPI 서버 프로세스를 종료한다.
          # CI 환경에서 백그라운드 프로세스를 남기지 않기 위한 정리 단계다.
          Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue

          # Playwright 테스트가 실패했다면 Quality Gate를 NO-GO로 기록하고 CI를 실패 처리한다.
          if ($webE2eExitCode -ne 0) {
            "NO-GO" | Out-File -FilePath reports/quality_gate.txt -Encoding utf8
            exit $webE2eExitCode
          }
      - name: Save Quality Gate Result
        # Smoke, Regression, Coverage Check가 모두 통과한 경우에만 실행되는 단계이다.
        # 앞 단계 중 하나라도 실패하면 workflow가 실패로 종료되기 때문에 여기까지 오지 못한다.
        run: |
          # Quality Gate 결과를 사람이 읽기 쉬운 형태로 파일에 저장한다.
          "Quality Gate Result" | Out-File -FilePath reports/quality_gate.txt -Encoding utf8
          "-------------------" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8
          "Smoke Test: PASS" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8
          "Regression Test: PASS" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8
          "Coverage Threshold: 90%" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8
          "Coverage Result: PASS" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8
          "Quality Gate: GO" | Out-File -FilePath reports/quality_gate.txt -Append -Encoding utf8

      - name: Upload test artifacts
        # 테스트가 성공하든 실패하든 항상 실행한다.
        # 실패 원인을 분석하려면 pytest report, 실행 로그, coverage 결과,
        # FastAPI 서버 로그, Playwright screenshot/trace 같은 자료가 필요하다.
        #
        # actions/upload-artifact@v4는 GitHub Actions 실행 결과 화면에서
        # 파일을 다운로드할 수 있게 해주는 공식 Artifact 업로드 액션이다.

        if: always()
        uses: actions/upload-artifact@v4
        with:
          # GitHub Actions 화면에 표시될 Artifact 이름이다.
          name: qa-test-artifacts

          # 일부 파일이 없더라도 바로 실패 처리하지 않고 경고만 표시한다.
          # 예를 들어 Playwright 테스트가 모두 성공하면 실패 screenshot/trace가 없을 수 있다.
          if-no-files-found: warn

          # path 아래에는 업로드할 파일 또는 폴더 경로만 작성한다.
          # 주석을 path 목록 안에 넣으면 파일 경로처럼 처리될 수 있으므로 넣지 않는다.
          path: |
            reports/smoke_result.xml
            reports/smoke_result.html
            reports/regression_result.xml
            reports/regression_result.html
            reports/quality_gate.txt
            logs/smoke_test_log.txt
            logs/regression_test_log.txt
            logs/coverage_test_log.txt
            logs/environment_info.txt
            reports/coverage.xml
            reports/coverage_html/**
            reports/web_e2e_result.xml
            reports/web_e2e_result.html
            logs/web_e2e_test_log.txt
            logs/web_demo_server.log
            logs/web_demo_server_error.log
            test-results/**
